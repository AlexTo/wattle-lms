version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    allow:
      - dependency-type: "all"
    groups:
      all:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    # "/" only covers .github/workflows and a root action.yml, so list the
    # composite actions' directories too.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
