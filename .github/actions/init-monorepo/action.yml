name: Initialize Monorepo
description: Initialize nx monorepo for CI workflows

# Mirrors nx-plugin-for-aws's .github/actions/init-monorepo, trimmed to what
# this workspace needs (no containers, Bun, Terraform or Smithy).

inputs:
  setup-uv:
    description: 'Install uv/Python. Needed by jobs that run infra:checkov (via `uvx`), i.e. the build target. Disable for jobs that do not run Python tooling.'
    required: false
    default: 'true'
  set-nx-shas:
    description: 'Set NX_BASE/NX_HEAD for `nx affected`. Requires a full-history checkout (fetch-depth: 0). Disable for jobs that do not run `nx affected`.'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Use PNPM
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        install: 'false'
    # Node 24 matches the Lambda runtime (nodejs24.x).
    - name: Use Node.js 24.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
    - name: Install the latest version of uv
      if: ${{ inputs.setup-uv == 'true' }}
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: 'latest'
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      name: Setup pnpm cache
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    - name: Install Node.js Dependencies
      shell: bash
      run: pnpm i --frozen-lockfile --prefer-offline
    - if: ${{ inputs.set-nx-shas == 'true' }}
      uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
