name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NX_DAEMON: "true"

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lint, test, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only the build target invokes checkov (via infra:checkov's `uvx`), so
      # only that leg needs uv. init-monorepo also sets NX_BASE/NX_HEAD so
      # `nx affected` diffs against the PR's target branch.
      - uses: ./.github/actions/init-monorepo
        with:
          setup-uv: ${{ matrix.target == 'build' }}

      - name: Run ${{ matrix.target }}
        run: pnpm nx affected --target ${{ matrix.target }}

      - name: Upload coverage reports to Codecov
        if: matrix.target == 'test'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
